<!doctype html>
<html><head><meta charset="utf-8"><title>Rook-like icon</title>
<style>html,body{margin:0;background:transparent}svg{display:block;width:1024px;height:1024px}</style></head>
<body>
<!-- The Rook-like app icon: a macOS-style rounded square (824px tile, 100px margin) with the rook's own
     64 x 64 PixelLab portrait on it, blown up 12x with its pixels kept sharp and his bust resting on the bottom edge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="c"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3d66"/><stop offset="1" stop-color="#121a2c"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="#5aa6f5" stop-opacity=".45"/><stop offset="1" stop-color="#5aa6f5" stop-opacity="0"/></radialGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <image href="../art/stones/rook-blue.png" x="128" y="156" width="768" height="768" style="image-rendering:pixelated"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sh)"/>
  </g>
</svg>
</body></html>
