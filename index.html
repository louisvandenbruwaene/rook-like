<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="body-you" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#7cc0ff"/><stop offset=".5" stop-color="#3b8be8"/><stop offset="1" stop-color="#1f5bb0"/></linearGradient>
    <linearGradient id="body-opponent" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#ff9a84"/><stop offset=".5" stop-color="#ec5440"/><stop offset="1" stop-color="#b02d1f"/></linearGradient>
    <linearGradient id="body-debris" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#4a4a54"/><stop offset="1" stop-color="#121216"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#f3c54a"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <!-- art.js: skin, the right-side shading every shape gets, metal, the stone's inner face, portrait vignette and glow -->
    <radialGradient id="art-skin" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fde3c6"/><stop offset=".55" stop-color="#f2c9a0"/><stop offset="1" stop-color="#d39b72"/></radialGradient>
    <linearGradient id="art-shade" x1="0" y1="0" x2="1" y2=".35"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
    <linearGradient id="art-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f5fa"/><stop offset=".45" stop-color="#b9c1d1"/><stop offset="1" stop-color="#6f7a8e"/></linearGradient>
    <radialGradient id="art-face" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></radialGradient>
    <radialGradient id="art-vignette" cx=".5" cy=".45" r=".7"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
    <radialGradient id="well-you" cx=".5" cy=".38" r=".62"><stop offset="0" stop-color="#2d66b4"/><stop offset="1" stop-color="#0c1f40"/></radialGradient>
    <radialGradient id="well-opponent" cx=".5" cy=".38" r=".62"><stop offset="0" stop-color="#b03a2c"/><stop offset="1" stop-color="#430d09"/></radialGradient>
    <radialGradient id="well-debris" cx=".5" cy=".38" r=".62"><stop offset="0" stop-color="#2e2e36"/><stop offset="1" stop-color="#08080a"/></radialGradient>
    <clipPath id="art-clip"><rect x="19" y="19" width="62" height="62" rx="9"/></clipPath>
    <radialGradient id="art-glow"><stop offset="0" stop-color="#9b5de5" stop-opacity=".45"/><stop offset="1" stop-color="#9b5de5" stop-opacity="0"/></radialGradient>
  </defs>
</svg>

<div class="page">
  <header class="top-bar">
    <div class="title"><h1>Rook-like</h1></div>
    <div class="run-progress"><div class="ladder" id="ladder"></div><div class="run-line" id="run-line"></div></div>
    <div class="controls">
      <button id="rules-button" title="Rules">?</button>
      <button id="slow-button" aria-pressed="false" title="Slow motion (S)">Slow</button>
    </div>
  </header>

  <div class="scoreboard">
    <div class="player you" id="player-you">
      <span class="name">You</span>
      <span class="points" id="points-you">0</span>
      <span class="spikes" id="spikes-you" title="Spikes left"></span>
    </div>
    <div class="tug-of-war" aria-hidden="true"><div class="you" id="tug-you"></div><div class="opponent" id="tug-opponent"></div></div>
    <div class="player opponent" id="player-opponent">
      <div class="portrait" id="opponent-portrait"></div>
      <span class="name" id="opponent-name"></span>
      <span class="points" id="points-opponent">0</span>
      <span class="spikes" id="spikes-opponent" title="Spikes left"></span>
    </div>
  </div>

  <main class="table">
    <div class="hand" id="your-hand"></div>
    <div class="centre">
      <div class="board-frame"><div class="board" id="board"></div></div>
      <div id="stone-info"></div>
      <div class="coach" id="coach" hidden></div>
    </div>
    <div class="hidden-hand"><div class="hidden-stack" id="opponent-hand"></div><span class="hand-count" id="opponent-hand-count"></span></div>
  </main>
</div>

<template id="rules-template">
  <h2>How to play</h2>
  <h3>A match</h3>
  <ul>
    <li>Take turns placing a stone from your hand on an empty square of the 4 × 4 board. Your stones are blue and face up the board, the opponent's are red and face down.</li>
    <li><b>Fights:</b> each side of your new stone that touches a red stone fights it. Facing spikes break off one for one, and the side with spikes left over wins and takes the other stone. A spike that hits is used up, so 2 against 1 ends 1 against 0. Lose any of these fights and your new stone is taken.</li>
    <li><b>Chains:</b> a stone that changes colour fights on with its own spikes, the pair closest to the new stone first, until no blue and red stones touch with a spike between them.</li>
    <li><b>Winning:</b> when the board is full, each stone you own is one point. Level on points, most spikes left wins (the ▲ number). Level on spikes too, whoever placed first wins.</li>
  </ul>
  <h3>Stones</h3>
  <ul>
    <li>Each level adds a spike to every side that has some, up to 5. Opponent stones can be level 0: one spike fewer on every spiked side, so a level 0 Tiny has none.</li>
    <li><b>King Kobe</b> has golden shields: every spike that touches him breaks, and he can never be taken.</li>
    <li><b>Rare stones</b> have their own powers and their own growth (see below). Each belongs to one opponent, who always brings it.</li>
  </ul>
  <h3>A run</h3>
  <ul>
    <li>A run is <b>20 matches</b>, and match 20 is the boss. Lose one and the run is over. The difficulty is picked once per game (New game, below, starts over with the starter stones): Easy (opponents look 2 moves ahead, stones from level 0), Normal (as far ahead as they can, level 0), Hard (2 moves, level 1) or Very hard (as far as they can, level 1).</li>
    <li>Before each match you see the opponent's stones and pick 8 of yours, at most one king and one queen. Your king and your 7 spikiest stones are picked for you: tap a stone to swap it.</li>
    <li>After each match you win, every opponent's deck upgrades one stone. On Easy the Tinies go first, on Normal the Tinies, knights, bishops and rooks, one level at a time. The boss starts 6 upgrades ahead. Lady Lux, whose Experienced Edna cures poison, always comes before Madame Swerve and her Venom Veronica.</li>
    <li>After a win, upgrade one of three stones from your deck by one level (the old one stays, except a queen, who is replaced), and get a stone the opponent played that you do not own, at level 1. When a run ends, keep one stone you gained in it for good.</li>
  </ul>
  <h3>Controls</h3>
  <ul>
    <li>Pick a stone (or press its number), then point at a square, or tap it once on a phone: yellow stones you would take, red stones you would lose, faded spikes would break. Slow (or S) plays every move four times slower.</li>
  </ul>
  <div class="piece-guide" id="piece-guide"></div>
  <p class="record" id="record"></p>
  <div class="rules-footer">
    <div class="rules-footer-links">
      <button class="text-button" id="tutorial-button">Replay tutorial</button>
      <button class="text-button" id="give-up-button">Give up this run</button>
      <button class="text-button" id="new-game-button">New game</button>
    </div>
    <button class="primary" id="close-rules-button">Back to the game</button>
  </div>
</template>

<div class="modal" id="card-modal" hidden><div class="card" id="card"></div></div>
<div class="modal" id="rules-modal" hidden><div class="card rules" id="rules-card"></div></div>

<script src="src/save.js"></script>
<script src="src/screen.js"></script>

</body>
</html>
