<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A roguelike of spiked chess stones: twenty duels, one crown. Free browser game.">
<title>Rook-like</title>
<meta name="theme-color" content="#162034">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="body-you" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#7cc0ff"/><stop offset=".5" stop-color="#3b8be8"/><stop offset="1" stop-color="#1f5bb0"/></linearGradient>
    <linearGradient id="body-opponent" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#ff9a84"/><stop offset=".5" stop-color="#ec5440"/><stop offset="1" stop-color="#b02d1f"/></linearGradient>
    <linearGradient id="body-debris" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#4a4a54"/><stop offset="1" stop-color="#121216"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#f3c54a"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
</svg>

<div class="page">
  <header class="top-bar">
    <div class="title"><h1>Rook-like</h1></div>
    <div class="run-progress"><div class="ladder" id="ladder"></div><div class="run-line" id="run-line"></div></div>
    <div class="controls">
      <button id="rules-button" title="Rules">?</button>
      <button id="slow-button" aria-pressed="false" title="Slow motion (S)">Slow</button>
    </div>
  </header>

  <div class="scoreboard">
    <div class="player you" id="player-you">
      <span class="name">You</span>
      <span class="points" id="points-you">0</span>
      <span class="spikes" id="spikes-you" title="Spikes left"></span>
    </div>
    <div class="tug-of-war" aria-hidden="true"><div class="you" id="tug-you"></div><div class="opponent" id="tug-opponent"></div></div>
    <div class="player opponent" id="player-opponent">
      <div class="portrait" id="opponent-portrait"></div>
      <span class="name" id="opponent-name"></span>
      <span class="points" id="points-opponent">0</span>
      <span class="spikes" id="spikes-opponent" title="Spikes left"></span>
    </div>
  </div>

  <main class="table">
    <div class="hand" id="your-hand"></div>
    <div class="centre">
      <div class="board-frame"><div class="board" id="board"></div></div>
      <div id="stone-info"></div>
    </div>
    <div class="hidden-hand"><div class="hidden-stack" id="opponent-hand"></div><span class="hand-count" id="opponent-hand-count"></span></div>
  </main>
</div>

<template id="rules-template">
  <h2>How to play</h2>
  <h3>A match</h3>
  <ul>
    <li>Take turns placing a stone from your hand on an empty square of the 4 × 4 board. You never see the opponent's hand.</li>
    <li>Before each match you pick 8 stones from your collection to play with, at most one king and one queen. Your king and your 7 spikiest stones are picked for you; tap a stone to swap it. The same stone may come at several levels, say a level 4 and a level 5 rook. You start with Tiny Tim, Tiny Tony and Tiny Ted (pawns), Neigh Nigel (knight), Bishop Bailey (bishop), Castle Carl (rook), Duchess Dagger (queen) and King Kobe (king). Your stones face up the board, the opponent's are turned round and face down. Each level adds a spike to every side that has some, up to 5. Opponents' stones can be level 0: one spike fewer on every spiked side, so a level 0 tiny has none.</li>
    <li><b>King Kobe</b> has golden shields on every side: every spike that touches him breaks, and he can never be taken.</li>
    <li><b>Rare stones</b> have their own powers and their own growth (see below). Each belongs to one opponent, who always plays it and may offer it when you win.</li>
  </ul>
  <h3>Fights</h3>
  <ul>
    <li><b>Clash:</b> each side of your new stone that touches an enemy stone fights it. Facing spikes break off one for one, and the side with spikes left over wins and takes the other stone. A spike that hits is used up, so the winner always loses at least one spike: 2 against 1 ends 1 against 0, and 1 against 0 ends 0 against 0. That works both ways: lose any clash and your new stone is taken.</li>
    <li><b>Chain:</b> after the new stone has fought, as long as two stones of different colours touch with a spike between them, they fight the same way, the pair closest to the new stone first. So when a move ends, no two stones of different colours touch with a spike between them.</li>
  </ul>
  <h3>Winning</h3>
  <ul>
    <li>When the board is full, count your stones, one point each. Most points wins. Level on points: most spikes left on your stones wins (the small number by each score). Level on spikes too: whoever placed first wins, since the other side had the last move. Whoever loses His Hovering Holiness loses the match at once.</li>
  </ul>
  <h3>A run</h3>
  <ul>
    <li>A run is <b>20 matches</b>. Lose one and the run is over. Match 20 is the boss. At the start of a game you pick a difficulty, and every run of that game plays it (New game, below, starts over with the starter stones): Easy (opponents look 2 moves ahead, stones from level 0), Normal (as far ahead as they can, level 0), Hard (2 moves, level 1) or Very hard (as far as they can, level 1).</li>
    <li>Opponents come in a random order, but Lady Lux, whose Experienced Edna cures poison, always comes before Madame Swerve and her Venom Veronica. Every opponent keeps their own deck for the whole run. After each match you win, every deck upgrades one stone by one level, so they all grow even while you face someone else. On Easy the tinies go up first, on Normal the tinies, knights, bishops and rooks, one level at a time. The boss starts 6 upgrades ahead.</li>
    <li>After a win, upgrade one of three random stones from your deck by one level. The old one stays in your collection, except a queen, who is replaced. If the opponent played a stone you do not own (piece and turn), you also get one of those, at level 1. When a run ends, keep one stone you held that run and do not own yet: it joins your collection for good, and a new queen replaces your old one.</li>
    <li>Every opponent always brings the same stones. Remember what they play.</li>
  </ul>
  <h3>Controls</h3>
  <ul>
    <li>Pick a stone, then hover over a square (or tap it once on a phone): yellow stones you would take, red stones you would lose, faded spikes would break. Slow (or S) plays every move four times slower.</li>
  </ul>
  <div class="piece-guide" id="piece-guide"></div>
  <p class="record" id="record"></p>
  <div class="rules-footer">
    <div class="rules-footer-links">
      <button class="text-button" id="give-up-button">Give up this run</button>
      <button class="text-button" id="new-game-button">New game</button>
    </div>
    <button class="primary" id="close-rules-button">Back to the game</button>
  </div>
</template>

<div class="modal" id="card-modal" hidden><div class="card" id="card"></div></div>
<div class="modal" id="rules-modal" hidden><div class="card rules" id="rules-card"></div></div>

</body>
</html>
